<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Minds 3, Unit 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --ink:#1C2733; --muted:#5F6E7D; --line:#DCE3EA;
  --lamp-off:#E3E8ED; --housing:#2A3440;
  --c-dgreen:#2E9E4F; --c-green:#6CC04A; --c-lgreen:#B5DD8F; --c-yellow:#F4C542; --c-red:#E8644F;
  --accent:#3A6EA5; --sel:#E6EEF7;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141B22; --surface:#1D2731; --ink:#EAF0F5; --muted:#9AA9B7; --line:#2E3B48;
    --lamp-off:#34414E; --housing:#0F151B; --sel:#263545; --accent:#7FB0E3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141B22; --surface:#1D2731; --ink:#EAF0F5; --muted:#9AA9B7; --line:#2E3B48;
  --lamp-off:#34414E; --housing:#0F151B; --sel:#263545; --accent:#7FB0E3;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-family:"Unbounded","Golos Text",system-ui,sans-serif;font-weight:700;font-size:clamp(22px,3.4vw,32px);margin:0;letter-spacing:-.01em}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;flex:none}
.theme-btn:focus-visible,.student:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 20px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}

.layout{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.students{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.student{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:500;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer}
.student:hover{background:var(--sel)}
.student[aria-selected="true"]{background:var(--sel);font-weight:600}
.student .dot{width:10px;height:10px;border-radius:50%;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:32px}
.left{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.name{font-family:"Unbounded","Golos Text",system-ui,sans-serif;font-weight:700;font-size:28px;margin:0}
.book{color:var(--muted);margin:0;font-size:15px}
.ring{position:relative;width:200px;height:200px;margin:6px 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-family:"Unbounded","Golos Text",system-ui,sans-serif;font-weight:700;font-size:44px;line-height:1}
.ring .pts{font-size:14px;color:var(--muted);margin-top:6px}
.verdict{font-weight:600;font-size:17px;max-width:280px;margin:2px 0 0}

.light{display:inline-flex;gap:8px;background:var(--housing);border-radius:999px;padding:8px 12px}
.light b{width:26px;height:26px;border-radius:50%;background:var(--lamp-off);display:block}
.light.small{gap:5px;padding:5px 8px}
.light.small b{width:14px;height:14px}

.right{display:flex;flex-direction:column;gap:12px;justify-content:center}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 16px;padding:16px 18px;border:1px solid var(--line);border-radius:14px}
.row h3{margin:0;font-size:17px;font-weight:600}
.row .meta{color:var(--muted);font-size:14px}
.row .right-side{display:flex;align-items:center;gap:14px}
.row .p{font-family:"Unbounded","Golos Text",system-ui,sans-serif;font-weight:700;font-size:22px;min-width:64px;text-align:right}
.att{border-style:dashed}
.att h3{white-space:nowrap}
@media (max-width:480px){.att{grid-template-columns:1fr}.att h3{white-space:normal}}
.squares{display:flex;gap:6px;flex-wrap:wrap}
.squares i{width:18px;height:18px;border-radius:4px;border:2px solid var(--muted);display:block}
.squares i.on{background:var(--muted)}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .students{flex-direction:row;overflow-x:auto;scrollbar-width:thin}
  .student{flex:none}
  .card{grid-template-columns:1fr;padding:20px;gap:24px}
}
@media (prefers-reduced-motion:no-preference){
  .ring circle.val{transition:stroke-dasharray .6s ease}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <button class="theme-btn" id="themeBtn" type="button">Сменить тему</button>
  </header>

  <div class="legend" id="legend"></div>

  <div class="layout">
    <nav class="students" id="students" role="tablist" aria-label="Ученики"></nav>
    <main class="card" id="card" role="tabpanel" aria-live="polite"></main>
  </div>
</div>

<script>
/* ===== Данные юнита: меняются только здесь ===== */
const UNIT = {
  book: "Super Minds 3",
  unit: 1,
  lessons: 6,
  max: { lessons: 360, hw: 150, test: 250 },
  students: [
    { name: "Polly",    attended: 6, lessons: 270, hw: 120, test: 160 },
    { name: "Mike",     attended: 5, lessons: 280, hw: 140, test: 200 },
    { name: "Veronica", attended: 6, lessons: 300, hw: 120, test: 200 },
    { name: "Vasilisa", attended: 6, lessons: 260, hw: 150, test: 180 },
    { name: "Ksusha",   attended: 6, lessons: 300, hw: 40,  test: 170 },
    { name: "Mark",     attended: 6, lessons: 280, hw: 150, test: 200 },
    { name: "Fedor",    attended: 6, lessons: 350, hw: 150, test: 220 }
  ]
};

/* ===== Шкала-светофор ===== */
const SCALE = [
  { min: 90, color: "var(--c-dgreen)", lamp: 2, label: "90–100%", verdict: "Очень уверенно" },
  { min: 80, color: "var(--c-green)",  lamp: 2, label: "80–90%",  verdict: "Уверенно" },
  { min: 70, color: "var(--c-lgreen)", lamp: 2, label: "70–80%",  verdict: "Позитивный результат" },
  { min: 60, color: "var(--c-yellow)", lamp: 1, label: "60–70%",  verdict: "Двигаемся вперёд, но есть моменты для обсуждения" },
  { min: 0,  color: "var(--c-red)",    lamp: 0, label: "ниже 60%", verdict: "Нужно срочно подтянуть" }
];
const level = p => SCALE.find(s => p >= s.min);
const pct = (v, m) => Math.round(v / m * 100);
const maxTotal = UNIT.max.lessons + UNIT.max.hw + UNIT.max.test;

function light(p, small){
  const l = level(p);
  const lamps = [0,1,2].map(i => `<b style="${i === l.lamp ? `background:${l.color}` : ""}"></b>`).join("");
  return `<span class="light${small ? " small" : ""}" aria-hidden="true">${lamps}</span>`;
}

document.getElementById("title").textContent = `${UNIT.book}, Unit ${UNIT.unit}`;
document.title = `${UNIT.book}, Unit ${UNIT.unit}`;
document.getElementById("legend").innerHTML =
  SCALE.map(s => `<span><i style="background:${s.color}"></i>${s.label} — ${s.verdict.toLowerCase()}</span>`).join("");

const list = document.getElementById("students");
const card = document.getElementById("card");

function totals(s){
  const total = s.lessons + s.hw + s.test;
  return { total, p: pct(total, maxTotal) };
}

function row(title, v, m){
  const p = pct(v, m);
  return `<div class="row">
    <div><h3>${title}</h3><div class="meta">${v} из ${m} баллов</div></div>
    <div class="right-side">${light(p, true)}<span class="p">${p}%</span></div>
  </div>`;
}

function render(i){
  const s = UNIT.students[i];
  const t = totals(s);
  const l = level(t.p);
  const R = 86, C = 2 * Math.PI * R;
  const squares = Array.from({length: UNIT.lessons}, (_, k) => `<i class="${k < s.attended ? "on" : ""}"></i>`).join("");

  card.innerHTML = `
    <section class="left">
      <h2 class="name">${s.name}</h2>
      <p class="book">${UNIT.book}, Unit ${UNIT.unit}</p>
      <div class="ring">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--lamp-off)" stroke-width="16"/>
          <circle class="val" cx="100" cy="100" r="${R}" fill="none" stroke="${l.color}" stroke-width="16"
            stroke-linecap="round" stroke-dasharray="${C * t.p / 100} ${C}"/>
        </svg>
        <div class="center"><span class="pct">${t.p}%</span><span class="pts">${t.total} из ${maxTotal} баллов</span></div>
      </div>
      ${light(t.p, false)}
      <p class="verdict">${l.verdict}</p>
    </section>
    <section class="right">
      <div class="row att">
        <div><h3>Посещено занятий ${s.attended} из ${UNIT.lessons}</h3></div>
        <div class="squares" aria-hidden="true">${squares}</div>
      </div>
      ${row("Занятия", s.lessons, UNIT.max.lessons)}
      ${row("Домашние задания", s.hw, UNIT.max.hw)}
      ${row("Тест", s.test, UNIT.max.test)}
    </section>`;

  [...list.children].forEach((b, k) => b.setAttribute("aria-selected", k === i ? "true" : "false"));
}

UNIT.students.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "student"; b.type = "button"; b.setAttribute("role", "tab");
  b.innerHTML = `<span>${s.name}</span><span class="dot" style="background:${level(totals(s).p).color}"></span>`;
  b.addEventListener("click", () => render(i));
  list.appendChild(b);
});
render(0);

/* Тема */
document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
</script>
</body>
</html>
