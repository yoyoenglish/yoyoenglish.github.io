<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Think 3, Unit 1 — B1+ Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1b1d22; --muted:#6b7280; --line:#e3e6ea;
  --lamp-off:#d9dce1; --housing:#2a2d33; --sel:#1b1d22; --sel-text:#fff;
  --c-dg:#1e8e3e; --c-g:#43b05c; --c-lg:#9ad19a; --c-y:#f2c230; --c-r:#e5484d;
  --att:#5b6b8c;
}
[data-theme="dark"]{
  --bg:#121417; --card:#1c1f24; --text:#eef0f3; --muted:#9aa3ae; --line:#2e333a;
  --lamp-off:#3a3f47; --housing:#0b0c0e; --sel:#eef0f3; --sel-text:#121417;
  --att:#8fa1c7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Golos Text",system-ui,sans-serif;transition:background .2s,color .2s}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-family:"Unbounded",sans-serif;font-size:26px;margin:0}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font:500 14px "Golos Text",system-ui,sans-serif;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}
.layout{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.students{display:flex;flex-direction:column;gap:6px}
.students button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px 14px;font:500 15px "Golos Text",system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;gap:10px;white-space:nowrap}
.students button .dot{width:10px;height:10px;border-radius:50%;flex:none}
.students button.active{background:var(--sel);color:var(--sel-text);border-color:var(--sel)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;grid-template-columns:300px 1fr;gap:28px}
.left{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.name{font-family:"Unbounded",sans-serif;font-size:24px;font-weight:600}
.sub{color:var(--muted);font-size:14px}
.ring{position:relative;width:190px;height:190px}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-family:"Unbounded",sans-serif;font-size:40px;font-weight:700}
.ring .pts{font-size:13px;color:var(--muted)}
.tl{display:flex;gap:8px;background:var(--housing);padding:8px 10px;border-radius:999px}
.tl.big .lamp{width:30px;height:30px}
.lamp{width:16px;height:16px;border-radius:50%;background:var(--lamp-off)}
.lamp.on{box-shadow:0 0 10px currentColor}
.verdict{font-weight:600;font-size:15px;max-width:260px}
.right{display:flex;flex-direction:column;gap:12px}
.row{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px}
.row .label{font-weight:600;font-size:16px}
.row .val{font-size:14px;color:var(--muted);text-align:right}
.row .val b{font-family:"Unbounded",sans-serif;font-size:20px;color:var(--text);display:block}
.att{border-style:dashed;grid-template-columns:1fr auto}
.squares{display:flex;gap:5px}
.sq{width:18px;height:18px;border-radius:5px;border:2px solid var(--att)}
.sq.on{background:var(--att)}
.att .label span{color:var(--muted);font-weight:500}
@media (max-width:820px){
  .wrap{padding:14px}
  h1{font-size:20px}
  .layout{grid-template-columns:1fr}
  .students{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .card{grid-template-columns:1fr;padding:18px}
  .row{grid-template-columns:1fr auto;}
  .row .tl{grid-column:1/-1;justify-self:start}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <button class="theme-btn" id="themeBtn">🌙 Тёмная тема</button>
  </header>
  <div class="legend" id="legend"></div>
  <div class="layout">
    <nav class="students" id="students"></nav>
    <main class="card" id="card"></main>
  </div>
</div>
<script>
/* ===== Входные данные юнита ===== */
const UNIT = {
  coursebook: "Think 3",
  unit: 1,
  lessons: 6,
  max: { lessons: 360, hw: 150, test: 240 }
};
const STUDENTS = [
  { name: "Dima",     attended: 6, lessons: 330, hw: 90,  test: 130 },
  { name: "Nika",     attended: 6, lessons: 330, hw: 90,  test: 220 },
  { name: "Veronica", attended: 4, lessons: 210, hw: 90,  test: 160 },
  { name: "Masha",    attended: 6, lessons: 310, hw: 150, test: 190 }
];
/* ===== Шкала светофора ===== */
const SCALE = [
  { min: 90, color: "var(--c-dg)", lamp: 2, label: "90%+ — очень уверенно",   verdict: "Очень уверенно!" },
  { min: 80, color: "var(--c-g)",  lamp: 2, label: "80–90% — уверенно",        verdict: "Уверенно" },
  { min: 70, color: "var(--c-lg)", lamp: 2, label: "70–80% — положительно",    verdict: "Положительный результат" },
  { min: 60, color: "var(--c-y)",  lamp: 1, label: "60–70% — двигаемся вперёд", verdict: "Двигаемся вперёд, но есть моменты для обсуждения" },
  { min: 0,  color: "var(--c-r)",  lamp: 0, label: "ниже 60% — нужно срочно исправлять", verdict: "Нужно срочно исправлять" }
];
const LAMP_COLORS = ["var(--c-r)", "var(--c-y)"];
const pct = (v, m) => Math.round(v / m * 100);
const level = p => SCALE.find(s => p >= s.min);

function lights(p, big) {
  const l = level(p);
  let h = `<div class="tl${big ? " big" : ""}">`;
  for (let i = 0; i < 3; i++) {
    const on = i === l.lamp;
    const c = on ? (i === 2 ? l.color : LAMP_COLORS[i]) : "";
    h += `<div class="lamp${on ? " on" : ""}" style="${on ? `background:${c};color:${c}` : ""}"></div>`;
  }
  return h + "</div>";
}

const totalMax = UNIT.max.lessons + UNIT.max.hw + UNIT.max.test;
const unitTitle = `${UNIT.coursebook}, Unit ${UNIT.unit}`;
document.getElementById("title").textContent = unitTitle;
document.getElementById("legend").innerHTML =
  SCALE.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("");

let current = 0;
function renderList() {
  document.getElementById("students").innerHTML = STUDENTS.map((s, i) => {
    const t = pct(s.lessons + s.hw + s.test, totalMax);
    return `<button class="${i === current ? "active" : ""}" onclick="select(${i})">
      <span class="dot" style="background:${level(t).color}"></span>${s.name}</button>`;
  }).join("");
}
function row(label, v, m) {
  const p = pct(v, m);
  return `<div class="row"><div class="label">${label}</div>${lights(p)}
    <div class="val"><b>${p}%</b>${v} из ${m} баллов</div></div>`;
}
function renderCard() {
  const s = STUDENTS[current];
  const total = s.lessons + s.hw + s.test;
  const p = pct(total, totalMax);
  const l = level(p);
  const R = 80, C = 2 * Math.PI * R;
  let sq = "";
  for (let i = 0; i < UNIT.lessons; i++) sq += `<div class="sq${i < s.attended ? " on" : ""}"></div>`;
  document.getElementById("card").innerHTML = `
    <div class="left">
      <div class="name">${s.name}</div>
      <div class="sub">${unitTitle}</div>
      <div class="ring">
        <svg width="190" height="190" viewBox="0 0 190 190">
          <circle cx="95" cy="95" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/>
          <circle cx="95" cy="95" r="${R}" fill="none" stroke="${l.color}" stroke-width="16"
            stroke-linecap="round" stroke-dasharray="${C * p / 100} ${C}"/>
        </svg>
        <div class="center"><div class="pct">${p}%</div><div class="pts">${total} из ${totalMax} баллов</div></div>
      </div>
      ${lights(p, true)}
      <div class="verdict">${l.verdict}</div>
    </div>
    <div class="right">
      <div class="row att"><div class="label">Посещено занятий <span>${s.attended} из ${UNIT.lessons}</span></div>
        <div class="squares">${sq}</div></div>
      ${row("Занятия", s.lessons, UNIT.max.lessons)}
      ${row("Домашние задания", s.hw, UNIT.max.hw)}
      ${row("Тест", s.test, UNIT.max.test)}
    </div>`;
}
function select(i) { current = i; renderList(); renderCard(); }

/* ===== Тема ===== */
const btn = document.getElementById("themeBtn");
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  btn.textContent = t === "dark" ? "☀️ Светлая тема" : "🌙 Тёмная тема";
  try { localStorage.setItem("yoyo-theme", t); } catch (e) {}
}
let saved = null;
try { saved = localStorage.getItem("yoyo-theme"); } catch (e) {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
btn.onclick = () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

select(0);
</script>
</body>
</html>
