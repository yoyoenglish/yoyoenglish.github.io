<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Minds 4, Unit 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef1f7; --text:#1d2433; --muted:#667085; --line:#d9dee8;
  --ring-track:#e6e9f0; --lamp-off:#dfe3ea; --housing:#2b3140;
  --neutral:#5b6b8c; --neutral-soft:#e3e8f3;
  --c5:#2f8f3a;  /* 90%+   тёмно-зелёный */
  --c4:#62b04f;  /* 80–90  зелёный */
  --c3:#a8d27e;  /* 70–80  светло-зелёный */
  --c2:#f1c232;  /* 60–70  жёлтый */
  --c1:#e2553f;  /* <60    красный */
  --font-head:"Unbounded","Golos Text",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --surface:#1b2029; --surface-2:#232a35; --text:#e9edf5; --muted:#9aa4b6; --line:#2f3745;
    --ring-track:#2a313d; --lamp-off:#343c4a; --housing:#0d1015;
    --neutral:#9fb0d0; --neutral-soft:#2a3446;
    --c5:#3fae4b; --c4:#74c160; --c3:#b3db8b; --c2:#f4cb4a; --c1:#ef6a55;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b2029; --surface-2:#232a35; --text:#e9edf5; --muted:#9aa4b6; --line:#2f3745;
  --ring-track:#2a313d; --lamp-off:#343c4a; --housing:#0d1015;
  --neutral:#9fb0d0; --neutral-soft:#2a3446;
  --c5:#3fae4b; --c4:#74c160; --c3:#b3db8b; --c2:#f4cb4a; --c1:#ef6a55;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.45}
.page{max-width:1100px;margin:0 auto;padding:28px 20px 40px}
h1{font-family:var(--font-head);font-weight:700;font-size:clamp(1.5rem,3.2vw,2.2rem);margin:0 0 22px;letter-spacing:-.01em}

.layout{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.students{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.students button{
  font:inherit;font-weight:600;text-align:left;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;
  display:flex;align-items:center;gap:10px;white-space:nowrap
}
.students button .dot{width:10px;height:10px;border-radius:50%;flex:none}
.students button[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.students button:focus-visible{outline:3px solid var(--neutral);outline-offset:2px}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 14px;padding:0;list-style:none;font-size:.88rem;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:7px}
.legend .sw{width:14px;height:14px;border-radius:4px;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:30px}
.summary{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.name{font-family:var(--font-head);font-weight:700;font-size:1.6rem;margin:0;line-height:1.15}
.sub{color:var(--muted);margin:-6px 0 4px;font-weight:500}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--ring-track);stroke-width:16}
.ring .bar{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .6s ease,stroke .3s}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-family:var(--font-head);font-weight:700;font-size:2.6rem;line-height:1}
.ring .pts{color:var(--muted);font-size:.8rem;margin-top:6px;white-space:nowrap}
.verdict{font-weight:600;font-size:1.02rem;max-width:260px}

.light{display:inline-flex;gap:8px;background:var(--housing);padding:8px 12px;border-radius:999px}
.light span{width:22px;height:22px;border-radius:50%;background:var(--lamp-off)}
.light.big span{width:30px;height:30px}
.light.small{gap:5px;padding:5px 8px}
.light.small span{width:14px;height:14px}
.light span.on{box-shadow:0 0 10px 1px var(--glow)}

.rows{display:flex;flex-direction:column;gap:12px;justify-content:center}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 16px;padding:16px 18px;border-radius:14px;background:var(--surface-2)}
.row h3{margin:0;font-size:1.05rem;font-weight:700}
.row .meta{color:var(--muted);font-size:.92rem;grid-column:1}
.row .right{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:14px}
.row .rp{font-family:var(--font-head);font-weight:700;font-size:1.35rem;min-width:3.6ch;text-align:right}
.row.attend{background:var(--neutral-soft);border:2px dashed var(--neutral)}
.squares{display:flex;gap:6px;flex-wrap:wrap}
.squares i{width:20px;height:20px;border-radius:5px;border:2px solid var(--neutral);display:block}
.squares i.full{background:var(--neutral)}

@media (max-width:760px){
  .page{padding:20px 14px 32px}
  .layout{grid-template-columns:1fr;gap:14px}
  .students{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .students button{scroll-snap-align:start}
  .card{grid-template-columns:1fr;padding:20px;gap:22px}
  .row{padding:14px}
}
@media (prefers-reduced-motion:reduce){.ring .bar{transition:none}}
</style>
</head>
<body>
<div class="page">
  <h1 id="title">Super Minds 4, Unit 1</h1>
  <div class="layout">
    <nav class="students" id="students" aria-label="Ученики"></nav>
    <main>
      <ul class="legend" id="legend"></ul>
      <article class="card" id="card" aria-live="polite"></article>
    </main>
  </div>
</div>

<script>
/* ===== Данные юнита: меняются только здесь ===== */
const UNIT = {
  coursebook: "Super Minds 4",
  unit: 1,
  lessons: 6,                       // занятий в юните
  max: { lesson: 360, hw: 150, test: 310 }  // максимум по каждой корзине
};
const STUDENTS = [
  // name, attended (посещено), lesson / hw / test — баллы
  { name: "Alyona",   attended: 6, lesson: 320, hw: 150, test: 310 },
  { name: "Dana",     attended: 3, lesson: 150, hw: 90,  test: 210 },
  { name: "Vova",     attended: 6, lesson: 320, hw: 150, test: 290 },
  { name: "Ruslan",   attended: 6, lesson: 320, hw: 120, test: 240 },
  { name: "Kirill B", attended: 6, lesson: 350, hw: 140, test: 260 },
  { name: "Fedor",    attended: 6, lesson: 320, hw: 150, test: 220 },
  { name: "Nikita",   attended: 6, lesson: 230, hw: 60,  test: 220 },
  { name: "Kirill P", attended: 6, lesson: 360, hw: 150, test: 290 }
];
/* =============================================== */

const SCALE = [
  { min: 90, cls: "c5", label: "90% и выше",  verdict: "Очень уверенно" },
  { min: 80, cls: "c4", label: "80–90%",       verdict: "Уверенно" },
  { min: 70, cls: "c3", label: "70–80%",       verdict: "Позитивный результат" },
  { min: 60, cls: "c2", label: "60–70%",       verdict: "Двигаемся вперёд, но есть моменты для обсуждения" },
  { min: 0,  cls: "c1", label: "ниже 60%",     verdict: "Требует срочной доработки" }
];
const level = p => SCALE.find(s => p >= s.min);
const pct = (v, m) => Math.round(v / m * 100);
const MAX_TOTAL = UNIT.max.lesson + UNIT.max.hw + UNIT.max.test;
const unitTitle = `${UNIT.coursebook}, Unit ${UNIT.unit}`;

document.title = unitTitle;
document.getElementById("title").textContent = unitTitle;

/* светофор: красная лампа <60, жёлтая 60–70, зелёная 70+ (оттенок зелёного — по шкале) */
function lightHTML(p, size) {
  const lv = level(p);
  const lamp = p >= 70 ? 2 : p >= 60 ? 1 : 0;
  const base = ["c1", "c2", null];
  return `<span class="light ${size}" role="img" aria-label="${lv.label}">` +
    [0, 1, 2].map(i => {
      if (i !== lamp) return "<span></span>";
      const c = i === 2 ? lv.cls : base[i];
      return `<span class="on" style="background:var(--${c});--glow:var(--${c})"></span>`;
    }).join("") + "</span>";
}

document.getElementById("legend").innerHTML = SCALE.map(s =>
  `<li><span class="sw" style="background:var(--${s.cls})"></span>${s.label}</li>`).join("");

const nav = document.getElementById("students");
const card = document.getElementById("card");
const R = 80, C = 2 * Math.PI * R;

function totals(s) {
  const total = s.lesson + s.hw + s.test;
  return { total, p: pct(total, MAX_TOTAL) };
}

STUDENTS.forEach((s, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = `<span class="dot" style="background:var(--${level(totals(s).p).cls})"></span>${s.name}`;
  b.addEventListener("click", () => show(i));
  nav.appendChild(b);
});

function row(title, val, max) {
  const p = pct(val, max);
  return `<div class="row"><h3>${title}</h3><div class="meta">${val} из ${max} баллов</div>
    <div class="right">${lightHTML(p, "small")}<span class="rp">${p}%</span></div></div>`;
}

function show(i) {
  const s = STUDENTS[i];
  const { total, p } = totals(s);
  const lv = level(p);
  [...nav.children].forEach((b, j) => b.setAttribute("aria-pressed", j === i));
  const squares = Array.from({ length: UNIT.lessons }, (_, k) =>
    `<i class="${k < s.attended ? "full" : ""}"></i>`).join("");
  card.innerHTML = `
    <section class="summary">
      <h2 class="name">${s.name}</h2>
      <div class="sub">${unitTitle}</div>
      <div class="ring">
        <svg viewBox="0 0 190 190" aria-hidden="true">
          <circle class="track" cx="95" cy="95" r="${R}"></circle>
          <circle class="bar" cx="95" cy="95" r="${R}" stroke="var(--${lv.cls})"
            stroke-dasharray="${C}" stroke-dashoffset="${C}"></circle>
        </svg>
        <div class="center"><span class="pct">${p}%</span><span class="pts">${total} из ${MAX_TOTAL} баллов</span></div>
      </div>
      ${lightHTML(p, "big")}
      <div class="verdict">${lv.verdict}</div>
    </section>
    <section class="rows">
      <div class="row attend"><h3>Посещено занятий ${s.attended} из ${UNIT.lessons}</h3>
        <div class="meta"><div class="squares" aria-hidden="true">${squares}</div></div></div>
      ${row("Занятия", s.lesson, UNIT.max.lesson)}
      ${row("Домашние задания", s.hw, UNIT.max.hw)}
      ${row("Тест", s.test, UNIT.max.test)}
    </section>`;
  const bar = card.querySelector(".bar");
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.strokeDashoffset = C * (1 - Math.min(p, 100) / 100);
  }));
}
show(0);
</script>
</body>
</html>
