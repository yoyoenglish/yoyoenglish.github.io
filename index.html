<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>YOYO English</title>
<style>
:root{--paper:#FBFCFF;--grid:#DCE7F6;--ink:#1E2A4A;--soft:#56627F;--marker:#F1C651}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#18213A;--grid:#223056;--ink:#E8EDF8;--soft:#A4B0CC}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.box{max-width:420px;text-align:center}
.mark{display:inline-flex;align-items:center;justify-content:center;height:92px;padding:0 22px;background:var(--marker);
border-radius:14px;color:#fff;font-weight:800;font-size:42px;letter-spacing:.5px}
h1{font-size:26px;margin:18px 0 8px}
p{color:var(--soft);margin:0}
</style>
</head>
<body>
<div class="box">
<div class="mark">YOYO</div>
<h1>YOYO English</h1>
<p>Страница вашей группы открывается по ссылке, которую преподаватель отправляет в чат.</p>
</div>
</body>
</html>
